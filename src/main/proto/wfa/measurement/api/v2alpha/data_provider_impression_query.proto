syntax = "proto3";

package wfa.measurement.api.v2alpha;

import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/type/interval.proto";

option java_package = "org.wfanet.measurement.api.v2alpha";
option java_multiple_files = true;
option java_outer_classname = "DataProviderImpressionQueryProto";
option go_package = "github.com/world-federation-of-advertisers/cross-media-measurement/cmms/apiv2alpha/cmmspb";

// Request for a `DataProvider`'s impression count.
//
// One request per (entity key union, time interval, filter) combination.
message DataProviderImpressionQueryRequest {
  // Unique identifier for idempotency and correlation.
  string request_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];

  // Resource name of the `DataProvider`.
  string data_provider = 2 [
    (google.api.resource_reference).type = "halo.wfanet.org/DataProvider",
    (google.api.field_behavior) = REQUIRED
  ];

  // Impression query.
  ImpressionQuery query = 3 [(google.api.field_behavior) = REQUIRED];
}

// Query parameters for an impression query.
message ImpressionQuery {
  // Identifier for an entity in the `DataProvider`'s system.
  message EntityKey {
    // Type of entity (e.g. "campaign", "ad_set").
    string entity_type = 1 [(google.api.field_behavior) = REQUIRED];

    // Identifier of the entity.
    string entity_id = 2 [(google.api.field_behavior) = REQUIRED];
  }

  // Filter to apply to events.
  message EventFilter {
    // Raw CEL expression that is applied to a message which has a field for
    // each event template.
    string expression = 1;
  }

  // Entity keys to look up (treated as union).
  //
  // Impressions are computed across all entity keys combined.
  repeated EntityKey entity_keys = 1 [(google.api.field_behavior) = REQUIRED];

  // Time interval for the measurement period.
  //
  // Both `start_time` and `end_time` must be specified.
  google.type.Interval time_interval = 2
      [(google.api.field_behavior) = REQUIRED];

  // Impression qualification filter applied to this query.
  //
  // If not specified, all impressions are included.
  EventFilter filter = 3;
}

// Response from a `DataProvider`'s impression query cloud function.
message DataProviderImpressionQueryResponse {
  // Publisher's impression count for a query.
  message ImpressionCount {
    // Range within which the true count for the requested `time_interval` lies.
    message Bounds {
      // Lower bound. Impressions certainly within the requested interval.
      int64 lower = 1 [(google.api.field_behavior) = REQUIRED];

      // Upper bound. The lower bound plus every impression that may fall within
      // the requested interval but cannot be attributed to it precisely.
      int64 upper = 2 [(google.api.field_behavior) = REQUIRED];
    }

    // Raw impression count from the publisher's system.
    //
    // When `bounds` is set this is the publisher's best available figure for
    // the requested interval rather than an exact one, and callers comparing
    // against a reported count should use `bounds`.
    int64 value = 1 [(google.api.field_behavior) = REQUIRED];

    // Set only when the publisher API cannot answer the requested
    // `time_interval` exactly, in which case `value` is approximate and the
    // true count lies within this range. Unset means `value` is exact.
    //
    // Some publisher APIs answer only at a coarser granularity than the
    // requested interval — for example Meta's Insights endpoint answers whole
    // days in an ad account's own timezone, which need not align with the
    // interval boundaries a caller derives from a report's measurement period.
    // Rather than fail such a query or silently return a count for a different
    // window, a `DataProvider` may answer the closest achievable window and
    // report how much of the result is attributable to the requested one.
    //
    // Bounds rather than the queried interval, because the gap cannot be
    // converted into a count by the caller: how many impressions fall in a
    // boundary period depends on delivery within it, which only the
    // `DataProvider` observes.
    Bounds bounds = 2;
  }

  // Detail about why a query was skipped.
  message SkipDetail {
    // Reason a query could not be computed by the `DataProvider`.
    enum SkipReason {
      // Default value used if the reason is omitted.
      SKIP_REASON_UNSPECIFIED = 0;

      // Filter not supported by this `DataProvider`'s publisher API.
      FILTER_NOT_SUPPORTED = 1;

      // Entity not found in the publisher's system.
      ENTITY_NOT_FOUND = 2;

      // Publisher API returned an error.
      API_ERROR = 3;
    }

    // Reason the query was skipped.
    SkipReason reason = 1 [(google.api.field_behavior) = REQUIRED];

    // Human-readable detail about the skip.
    string detail = 2;
  }

  // Echoed `request_id` from the request for correlation.
  string request_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];

  // Required. Query outcome.
  oneof outcome {
    // Publisher's impression count for this query.
    ImpressionCount result = 2;

    // Reason this query could not be computed.
    SkipDetail skipped = 3;
  }
}
