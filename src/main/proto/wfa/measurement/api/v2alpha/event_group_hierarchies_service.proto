syntax = "proto3";

package wfa.measurement.api.v2alpha;

import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "wfa/measurement/api/v2alpha/event_group_hierarchy.proto";

option java_package = "org.wfanet.measurement.api.v2alpha";
option java_multiple_files = true;
option java_outer_classname = "EventGroupHierarchiesServiceProto";
option go_package = "github.com/world-federation-of-advertisers/cross-media-measurement/cmms/apiv2alpha/cmmspb";

// Service for reading `EventGroupHierarchy` resources.
//
// `EventGroupHierarchy` resources are supplied by operator configuration, so
// this service is read-only.
service EventGroupHierarchies {
  // Returns the `EventGroupHierarchy` with the specified resource name.
  rpc GetEventGroupHierarchy(GetEventGroupHierarchyRequest)
      returns (EventGroupHierarchy) {
    option (google.api.method_signature) = "name";
  }

  // Lists the `EventGroupHierarchy` resources for a (`DataProvider`,
  // `MeasurementConsumer`) pair.
  rpc ListEventGroupHierarchies(ListEventGroupHierarchiesRequest)
      returns (ListEventGroupHierarchiesResponse) {
    option (google.api.method_signature) = "parent";
  }
}

// Request message for `GetEventGroupHierarchy` method.
message GetEventGroupHierarchyRequest {
  // Resource name.
  string name = 1 [
    (google.api.resource_reference).type =
        "halo.wfanet.org/EventGroupHierarchy",
    (google.api.field_behavior) = REQUIRED
  ];
}

// Request message for `ListEventGroupHierarchies` method.
message ListEventGroupHierarchiesRequest {
  // Resource name of the parent, of the form
  // `dataProviders/{data_provider}/measurementConsumers/{measurement_consumer}`.
  string parent = 1 [
    (google.api.resource_reference).child_type =
        "halo.wfanet.org/EventGroupHierarchy",
    (google.api.field_behavior) = REQUIRED
  ];

  // The maximum number of resources to return. The service may return fewer
  // than this value.
  //
  // If unspecified, at most 50 resources will be returned. The maximum value is
  // 100; values above this will be coerced to the maximum.
  int32 page_size = 2;

  // A token from a previous call, specified to retrieve the next page. See
  // https://aip.dev/158.
  string page_token = 3;
}

// Response message for `ListEventGroupHierarchies` method.
message ListEventGroupHierarchiesResponse {
  // The `EventGroupHierarchy` resources.
  repeated EventGroupHierarchy event_group_hierarchies = 1;

  // A token that can be specified in a subsequent call to retrieve the next
  // page. See https://aip.dev/158.
  string next_page_token = 2;
}
