syntax = "proto3";

package wfa.measurement.api.v2alpha;

import "google/api/field_behavior.proto";

option java_package = "org.wfanet.measurement.api.v2alpha";
option java_multiple_files = true;
option java_outer_classname = "QueryProto";
option go_package = "github.com/world-federation-of-advertisers/cross-media-measurement/cmms/apiv2alpha/cmmspb";

// The value of a population attribute, a field whose
// [EventFieldDescriptor.population_attribute][] is true.
message PopulationAttributeValue {
  // Value type selector. Required.
  oneof selector {
    // Value as a string. Only a STRING field type is supported.
    string string_value = 1;

    // Value as the symbol of an enum value, e.g. "VIDEO" rather than "1". Only
    // an ENUM field type is supported.
    string enum_value = 2;

    // Value as a Boolean. Only a BOOL field type is supported.
    bool bool_value = 3;

    // Value as a float. Only a FLOAT field type is supported.
    float float_value = 4;
  }
}

// A set of base vectors, summed. A VID's count in the set is its total across
// all of them.
message VectorSet {
  // Values of [Measurement.Multimeasurement.Vector.index][], distinct.
  repeated int32 base_vectors = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = UNORDERED_LIST
  ];
}

// Which VIDs a [Query][] covers. A VID passes when it satisfies every field
// that is set. An empty [VidFilter][] covers the whole population.
message VidFilter {
  // A Venn region, as who reached the VID and who did not.
  message ReachClause {
    // The VID's count is greater than zero in each of these sets.
    //
    // Repeated because each set is tested on its own, which is what
    // distinguishes intersection from union. `[{A}, {B}]` passes a VID
    // reached by both A and B. `[{A, B}]` sums the two first, so it also
    // passes a VID reached by A alone.
    repeated VectorSet reached_sets = 1
        [(google.api.field_behavior) = UNORDERED_LIST];

    // The VID's count is zero in this set.
    VectorSet unreached_set = 2 [(google.api.field_behavior) = OPTIONAL];
  }

  // A VID passes when it satisfies any clause.
  //
  // Repeated so that one query can cover a union of Venn regions, e.g. the
  // VIDs reached by A alone together with those reached by B alone. A single
  // clause cannot express that, since its own fields are conjunctive.
  repeated ReachClause reach_clauses = 1
      [(google.api.field_behavior) = UNORDERED_LIST];

  // The VID falls in a subpopulation matching every entry. The key is the
  // field path, e.g. "person.age_group".
  map<string, PopulationAttributeValue> attributes = 2
      [(google.api.field_behavior) = OPTIONAL];
}

// One metric to compute over the VIDs a [Query][] selects.
message MetricSpec {
  // A metric over the selected VIDs and their counts in [Query.summands][].
  enum Metric {
    // Default value. Never set intentionally.
    METRIC_UNSPECIFIED = 0;

    // Number of selected VIDs with a non-zero count.
    REACH = 1;

    // Histogram of the counts of the selected VIDs, folded at
    // [max_frequency][].
    FREQUENCY = 2;

    // Sum of the counts of the selected VIDs.
    IMPRESSIONS = 3;
  }
  // The metric. Required.
  Metric metric = 1 [(google.api.field_behavior) = REQUIRED];

  // Counts above this fold into the top bin. Required when [metric][] is
  // [FREQUENCY][Metric.FREQUENCY], and set only then.
  int32 max_frequency = 2 [(google.api.field_behavior) = OPTIONAL];
}

// One query over the base vectors of a multimeasurement, read as:
//
//   SELECT metrics FROM summands WHERE vid_filter GROUP BY grouping_paths
message Query {
  // Identifier echoed on [Measurement.Result.query_id][] by every result this
  // query produces. Opaque to the Kingdom and the Duchy. Required, and
  // distinct within a multimeasurement.
  string id = 1 [(google.api.field_behavior) = REQUIRED];

  // FROM. Whose counts to add for a VID that passes [vid_filter][].
  //
  // Independent of the vector sets named in [vid_filter][]: which VIDs the
  // query covers and whose impressions are counted for them are separate
  // choices. A query may select the VIDs reached by both A and B, then sum
  // only A's counts for them.
  VectorSet summands = 2 [(google.api.field_behavior) = REQUIRED];

  // WHERE. Covers the whole population when unset.
  VidFilter vid_filter = 3 [(google.api.field_behavior) = OPTIONAL];

  // GROUP BY. One result per combination of the values these fields take
  // across [PopulationSpec.subpopulations][]. The Duchy resolves each VID to
  // its subpopulation and reads the fields from there.
  //
  // Each entry is the path of a population attribute field, e.g.
  // "person.gender". Empty yields a single result.
  repeated string grouping_paths = 4
      [(google.api.field_behavior) = UNORDERED_LIST];

  // SELECT. Required, and distinct by [MetricSpec.metric][].
  repeated MetricSpec metrics = 5 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = UNORDERED_LIST
  ];
}
